<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shift Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-light: #ecfdf5;
            --danger: #ef4444;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
        }

        .input-with-addon {
            display: flex;
            gap: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .ampm-select {
            width: 90px;
            flex-shrink: 0;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        /* Modern Toggle Switch */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .toggle-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .results-panel {
            margin-top: 24px;
            padding: 20px;
            background: var(--success-light);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius);
            display: none;
        }

        .results-panel h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 12px;
        }

        .results-panel p {
            font-size: 0.875rem;
            color: #047857;
            margin-bottom: 8px;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.7);
            padding: 14px;
            border-radius: 8px;
            margin: 12px 0;
            text-align: center;
        }

        .countdown-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #065f46;
        }

        .countdown-timer {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--danger);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>⏳ Shift Tracker</h2>

        <div class="form-group">
            <label for="shiftLength">Select Total Shift Duration</label>
            <select id="shiftLength"></select>
        </div>

        <div class="toggle-container">
            <span class="toggle-label">Use 24-Hour Input Format</span>
            <label class="switch">
                <input type="checkbox" id="formatToggle" onchange="handleFormatToggleChange()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="form-group">
            <label for="completedTime">Already Completed Time (HH:MM or HH.MM)</label>
            <input type="text" id="completedTime" placeholder="e.g., 03:30 or 03.30">
            <div class="note">Enter how many exact hours and minutes you have worked so far.</div>
        </div>

        <div class="form-group">
            <label for="targetTime">Counting Start Time</label>
            <div class="input-with-addon">
                <input type="text" id="targetTime" placeholder="Leave blank for current time">
                <select id="targetTimeAmPm" class="ampm-select">
                    <option value="AM">AM</option>
                    <option value="PM" selected>PM</option>
                </select>
            </div>
            <div class="note" id="startTimeNote">Leave blank to capture current system time.</div>
        </div>

        <button onclick="calculateShiftBacklog()">Calculate & Track</button>

        <div class="results-panel" id="resultsPanel">
            <h3>📊 Shift Metrics</h3>
            <p id="startedAtText"></p>
            
            <div id="countdownContainer" class="countdown-box">
                <div class="countdown-label">⌛ Time Remaining to Work</div>
                <div class="countdown-timer" id="liveCountdown">00h 00m 00s</div>
            </div>
            
            <p id="shiftEndText" style="font-weight: 600; margin-bottom: 0; line-height: 1.4;"></p>
        </div>
    </div>

    <script>
        let countdownInterval = null;
        let targetEndTimeMs = null; 
        let shiftStartTimeObj = null;

        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('shiftLength');
            for (let i = 4; i <= 12; i++) {
                let option = document.createElement('option');
                option.value = i;
                option.textContent = `${i} Hour Shift`;
                if (i === 8) option.selected = true; 
                select.appendChild(option);
            }
            handleFormatToggleChange();
        });

        function handleFormatToggleChange() {
            const is24hr = document.getElementById('formatToggle').checked;
            const ampmSelect = document.getElementById('targetTimeAmPm');
            const note = document.getElementById('startTimeNote');
            const targetInput = document.getElementById('targetTime');

            if (is24hr) {
                ampmSelect.style.display = 'none';
                note.textContent = "Enter clock time in 24hr format (e.g., 15:30 or 15.30). Blank uses current time.";
                targetInput.placeholder = "e.g., 15:10";
            } else {
                ampmSelect.style.display = 'block';
                note.textContent = "Enter clock time (e.g., 03:10 or 03.10) and choose AM/PM. Blank uses current time.";
                targetInput.placeholder = "e.g., 03:10";
            }

            if (shiftStartTimeObj && targetEndTimeMs) {
                updateOutputMetricsDisplay();
            }
        }

        // Normalizes dividers by forcing colons into dots for structural parity
        function cleanTimeSeparator(str) {
            return str.trim().replace(':', '.');
        }

        function parseDuration(durationString) {
            if (!durationString) return { hours: 0, minutes: 0 };
            let normalized = cleanTimeSeparator(durationString);
            let parts = normalized.split('.');
            if (parts.length !== 2) throw new Error("Format error");
            
            let hours = parseInt(parts[0], 10);
            let minutes = parseInt(parts[1], 10);
            
            if (isNaN(hours) || isNaN(minutes) || minutes < 0 || minutes >= 60 || hours < 0) {
                throw new Error("Value error");
            }
            return { hours, minutes };
        }

        style="text-align: left;"
        function parseClockTime(timeString) {
            const use24hr = document.getElementById('formatToggle').checked;
            let normalized = cleanTimeSeparator(timeString);
            let parts = normalized.split('.');
            if (parts.length !== 2) throw new Error("Format error");
            
            let hours = parseInt(parts[0], 10);
            let minutes = parseInt(parts[1], 10);
            
            if (isNaN(hours) || isNaN(minutes) || minutes < 0 || minutes >= 60) {
                throw new Error("Value error");
            }

            if (use24hr) {
                if (hours < 0 || hours >= 24) throw new Error("Range error");
                return { hours, minutes };
            } else {
                if (hours < 1 || hours > 12) throw new Error("Range error");
                const ampm = document.getElementById('targetTimeAmPm').value;
                if (ampm === "AM" && hours === 12) hours = 0;
                else if (ampm === "PM" && hours !== 12) hours += 12;
                return { hours, minutes };
            }
        }

        function formatDualTimeDisplay(date) {
            let hours = date.getHours();
            let minutes = date.getMinutes();
            let seconds = date.getSeconds();

            let paddedMin = minutes < 10 ? '0' + minutes : minutes;
            let paddedSec = seconds < 10 ? '0' + seconds : seconds;

            let ampm = hours >= 12 ? 'PM' : 'AM';
            let hours12 = hours % 12;
            hours12 = hours12 ? hours12 : 12;
            let string12hr = `${hours12}:${paddedMin}:${paddedSec} ${ampm}`;

            let hours24 = hours < 10 ? '0' + hours : hours;
            let string24hr = `${hours24}:${paddedMin}:${paddedSec}`;

            return `${string12hr} &nbsp;(${string24hr})`;
        }

        function updateOutputMetricsDisplay() {
            document.getElementById("startedAtText").innerHTML = `<b>Counting Started At:</b> ${formatDualTimeDisplay(shiftStartTimeObj)}`;
            if (targetEndTimeMs) {
                document.getElementById("shiftEndText").innerHTML = `<b>🎯 Your Shift Ends At:</b><br>${formatDualTimeDisplay(new Date(targetEndTimeMs))}`;
            }
        }

        function calculateShiftBacklog() {
            if (countdownInterval) clearInterval(countdownInterval);

            let completedInput = document.getElementById("completedTime").value.trim();
            let targetInput = document.getElementById("targetTime").value.trim();
            let chosenShiftHours = parseInt(document.getElementById("shiftLength").value, 10);

            let compHours = 0, compMinutes = 0;
            try {
                let parsedComp = parseDuration(completedInput);
                compHours = parsedComp.hours;
                compMinutes = parsedComp.minutes;
            } catch (e) {
                alert("❌ Invalid Completed Time format! Use HH:MM or HH.MM (e.g., 02:45 or 02.45).");
                return;
            }

            let completedMs = ((compHours * 60) + compMinutes) * 60 * 1000;
            let totalShiftMs = chosenShiftHours * 60 * 60 * 1000; 
            let msLeftToWork = totalShiftMs - completedMs;

            shiftStartTimeObj = new Date(); 
            
            if (targetInput !== "") {
                try {
                    let parsedTime = parseClockTime(targetInput);
                    shiftStartTimeObj.setHours(parsedTime.hours);
                    shiftStartTimeObj.setMinutes(parsedTime.minutes);
                    shiftStartTimeObj.setSeconds(0);
                    shiftStartTimeObj.setMilliseconds(0);
                } catch (e) {
                    alert("❌ Invalid Start Time format! Ensure correct numbers matching input choice mode.");
                    return;
                }
            }

            document.getElementById("resultsPanel").style.display = "block";

            if (msLeftToWork > 0) {
                let completionClockTime = new Date(shiftStartTimeObj.getTime() + msLeftToWork);
                targetEndTimeMs = completionClockTime.getTime();
                
                updateOutputMetricsDisplay();
                document.getElementById("countdownContainer").style.display = "block";

                runLiveCountdown();
                countdownInterval = setInterval(runLiveCountdown, 1000);
            } else {
                targetEndTimeMs = null;
                updateOutputMetricsDisplay();
                document.getElementById("countdownContainer").style.display = "none";
                document.getElementById("shiftEndText").innerHTML = `🎉 ${chosenShiftHours} hours are already done! No extra waiting needed.`;
            }
        }

        function runLiveCountdown() {
            let now = new Date().getTime();
            let distance = targetEndTimeMs - now;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("liveCountdown").textContent = "00h 00m 00s";
                document.getElementById("shiftEndText").textContent = "🎉 Shift Complete!";
                return;
            }

            let hours = Math.floor(distance / (1000 * 60 * 60));
            let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((distance % (1000 * 60)) / 1000);

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById("liveCountdown").textContent = `${hours}h ${minutes}m ${seconds}s`;
        }
    </script>
</body>
</html>
