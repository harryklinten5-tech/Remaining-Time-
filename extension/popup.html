<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remaining Time</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">⌛</span><div><p class="eyebrow">WORKDAY COMPANION</p><h1>Remaining Time</h1></div></div>
      <p id="today" class="date"></p>
    </header>
    <section class="countdown" aria-live="polite">
      <p class="eyebrow">TIME REMAINING</p>
      <output id="remaining" class="digits">--:--:--</output>
      <p id="status" class="status">Set your shift to begin</p>
      <div class="progress-track"><div id="progress" class="progress"></div></div>
      <div class="metrics"><div><span>Elapsed</span><strong id="elapsed">—</strong></div><div><span>Shift ends</span><strong id="end-time">—</strong></div></div>
    </section>
    <form id="settings">
      <label>Shift length
        <select id="shift-hours" name="shiftHours">
          <option value="1">1 hour</option><option value="2">2 hours</option><option value="3">3 hours</option><option value="4">4 hours</option><option value="5">5 hours</option><option value="6">6 hours</option><option value="7">7 hours</option><option value="8" selected>8 hours</option><option value="9">9 hours</option><option value="10">10 hours</option><option value="11">11 hours</option><option value="12">12 hours</option>
        </select>
      </label>
      <div class="fields">
        <label>Start time<input id="start-time" name="startTime" type="time" required></label>
        <label>Already worked<input id="completed" name="completed" type="text" inputmode="numeric" placeholder="HH:MM" value="00:00" pattern="\\d{1,3}[:.]\\d{1,2}" required></label>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="actions"><button class="primary" type="submit">Save shift</button><button id="reset" class="secondary" type="button">Reset</button></div>
    </form>
    <p class="privacy">Saved on this device only. No account needed.</p>
  </main>
</body>
</html>
